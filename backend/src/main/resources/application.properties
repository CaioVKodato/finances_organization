spring.application.name=finance-api
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/finance-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Resposta JSON de erro mais clara em desenvolvimento (Spring Boot 2.3+)
server.error.include-message=always
server.error.include-binding-errors=on_param
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

spring.h2.console.enabled=true
spring.h2.console.path=/h2

app.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

# JWT (HS256 — mínimo 256 bits; troque em produção)
app.jwt.secret=dev-secret-must-be-at-least-32-bytes-long-for-hs256!!
app.jwt.expiration-ms=86400000
